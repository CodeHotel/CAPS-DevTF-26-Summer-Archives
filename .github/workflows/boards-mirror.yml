name: Mirror Mattermost Boards

# The mirror job copies new Mattermost Boards history into this repository on the
# self-hosted runner, using the exporter built into the runner image. The rearm
# job then starts the next run about ten minutes later; the schedule below only
# restarts that chain when it stops. Set the repository variable MIRROR_REARM to
# "off" to stop re-arming.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/boards-mirror.yml"
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mattermost-boards-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: [self-hosted, caps-archive]
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      MIRROR_CONFIG_PATH: /etc/mattermost-board-mirror/mirror.yml

    steps:
      - name: Create ephemeral credential files
        shell: bash
        env:
          ARCHIVE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test -r /run/credentials/mattermost-board-mirror-postgres
          credential_dir="${RUNNER_TEMP}/boards-mirror-credentials"
          install -d -m 0700 "${credential_dir}"
          printf '%s' "${ARCHIVE_GITHUB_TOKEN}" > "${credential_dir}/github-token"
          echo "BOARDS_MIRROR_GITHUB_CREDENTIAL_SOURCE=${credential_dir}/github-token" \
            >> "${GITHUB_ENV}"

      - name: Verify provisioned runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_python="/opt/mattermost-board-mirror/venv/bin/python"
          test -x "${runtime_python}"
          "${runtime_python}" -c \
            'import psycopg, yaml, boards_mirror; assert boards_mirror.__version__ == "0.8.4"'

      - name: Mirror source history
        shell: bash
        run: |
          set -euo pipefail
          runtime_python="/opt/mattermost-board-mirror/venv/bin/python"
          flock --wait 900 /runner/.caps-boards-archive.lock \
            "${runtime_python}" -m boards_mirror run-once \
              --config "${MIRROR_CONFIG_PATH}"

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          credential_dir="${RUNNER_TEMP}/boards-mirror-credentials"
          if [[ -d "${credential_dir}" ]]; then
            find "${credential_dir}" -type f -exec shred -u -- {} +
            rmdir "${credential_dir}"
          fi

  rearm:
    needs: mirror
    if: ${{ !cancelled() && vars.MIRROR_REARM != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Start the next run in about ten minutes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sleep 540
          waiting=$(gh run list --workflow boards-mirror.yml --limit 20 \
            --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and .status != \"completed\")] | length")
          if [ "${waiting}" -gt 0 ]; then
            echo "Another run is already queued or running."
            exit 0
          fi
          gh workflow run boards-mirror.yml --ref main
